name: Build IPA

on:
  push:
    branches: [main, master, "feat/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 版本
        run: xcodebuild -version

      - name: 计算版本号
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(sed -nE 's/^[[:space:]]+MARKETING_VERSION:[[:space:]]*"?([^"]+)"?.*/\1/p' project.yml | head -1)
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IPA_NAME=LocalServer-$VERSION-build$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "版本 $VERSION，构建号 $BUILD_NUMBER"

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译（不签名）
        run: |
          set -o pipefail
          set +e
          xcodebuild \
            -project LocalServer.xcodeproj \
            -scheme LocalServer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          status=$?
          grep -E "error:|warning: .*LocalServer/|BUILD (SUCCEEDED|FAILED)" build.log
          # 编译错误转成 annotation，公开仓库里不登录也能读到具体行
          grep -m5 -E "error: " build.log | sed 's/%/%25/g' | while IFS= read -r line; do
            echo "::error::$line"
          done
          if [ $status -ne 0 ] || [ ! -d build/Build/Products/Release-iphoneos/LocalServer.app ]; then
            # 没有 error: 行时（xcodebuild 中途退出等）把日志结尾也报出来，否则失败无从诊断
            echo "::error::xcodebuild 退出码 $status，没有产出 app，下面是 build.log 结尾"
            grep -m8 -E "error|fatal|failed|FAILED" build.log | sed 's/%/%25/g' | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -n 6 build.log | sed 's/%/%25/g' | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: 打包 IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LocalServer.app Payload/
          zip -qry "$IPA_NAME.ipa" Payload
          ls -lh "$IPA_NAME.ipa"

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: ${{ env.IPA_NAME }}.ipa

      - name: 发布到 Releases（推送 v* 标签时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.IPA_NAME }}.ipa

      # ipa 已经上传，测试失败不影响下载，但会让本次运行标红
      - name: 运行单元测试（模拟器）
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          best = None
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not m:
                  continue
              version = (int(m.group(1)), int(m.group(2)))
              for d in devices:
                  if d.get("isAvailable", True) and d["name"].startswith("iPhone"):
                      if best is None or version > best[0]:
                          best = (version, d["udid"], d["name"])
          print(best[1] if best else "")
          ')
          test -n "$UDID" || { echo "没有可用的 iPhone 模拟器"; exit 1; }
          echo "使用模拟器 $UDID"
          xcodebuild test \
            -project LocalServer.xcodeproj \
            -scheme LocalServer \
            -destination "id=$UDID" \
            -derivedDataPath build-test \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            | tee test.log | grep -E "error:|Test Case .* (passed|failed)|Executed [0-9]+ tests|TEST (SUCCEEDED|FAILED)" || true
          # 失败用例和断言信息转成 annotation，方便直接定位
          grep -m10 -E "error: |Test Case .* failed|Testing failed" test.log | sed 's/%/%25/g' | while IFS= read -r line; do
            echo "::error::$line"
          done || true
          grep -q "TEST SUCCEEDED" test.log

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore
