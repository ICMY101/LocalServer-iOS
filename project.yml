# XcodeGen 工程描述：运行 `xcodegen generate` 生成 LocalServer.xcodeproj
name: LocalServer
options:
  bundleIdPrefix: com.localserver
  deploymentTarget:
    iOS: "16.0"
targets:
  LocalServer:
    type: application
    platform: iOS
    sources:
      - path: LocalServer
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: LocalServer
        PRODUCT_BUNDLE_IDENTIFIER: com.localserver.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: YES
