# XcodeGen 工程描述：运行 `xcodegen generate` 生成 LocalServer.xcodeproj
name: LocalServer
options:
  bundleIdPrefix: com.localserver
  deploymentTarget:
    iOS: "16.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"
targets:
  LocalServer:
    type: application
    platform: iOS
    sources:
      - path: LocalServer
    dependencies:
      - package: ZIPFoundation
    scheme:
      testTargets:
        - LocalServerTests
    settings:
      base:
        PRODUCT_NAME: LocalServer
        PRODUCT_BUNDLE_IDENTIFIER: com.localserver.app
        # 发布版本号；构建号（CURRENT_PROJECT_VERSION）由 CI 自动设置为运行次数
        MARKETING_VERSION: "3.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: YES
  LocalServerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: LocalServer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localserver.app.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
